{# One coupon (PRD RF-5). The tear-off modal (T-27) builds on this markup. #}
<article class="coupon" aria-label="Cupom do jogo #{{ prize.game_id }}">
  <p class="muted small">Jogo #{{ prize.game_id }} · {{ prize.secret_word }}</p>
  {% if prize.description %}<p class="coupon-description">{{ prize.description }}</p>{% endif %}
  <p class="coupon-code">{{ prize.code }}</p>
  <p class="muted small">Ganho em {{ prize.claimed_at | local_datetime }}</p>
</article>
